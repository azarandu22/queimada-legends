<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Queimada Legends</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="app">

        <!-- =========================
             MENU PRINCIPAL
        ========================== -->

        <section id="menuScreen" class="screen active">

            <div class="logo">
                <h1>🔥 QUEIMADA LEGENDS</h1>

                <p>
                    Esporte • Poderes • Estratégia
                </p>
            </div>

            <div class="menu-buttons">

                <button id="playBtn" class="main-btn">
                    ⚡ JOGAR 3x3
                </button>

                <button id="charactersBtn" class="main-btn">
                    👤 PERSONAGENS
                </button>

                <button id="optionsBtn" class="main-btn">
                    ⚙️ OPÇÕES
                </button>

            </div>

            <p class="version">
                Protótipo 0.3 • Quadra vertical • Modo 3x3
            </p>

        </section>


        <!-- =========================
             TELA DE PERSONAGENS
        ========================== -->

        <section id="characterScreen" class="screen">

            <div class="screen-header">

                <button id="backFromCharactersBtn" class="back-btn">
                    ← VOLTAR
                </button>

                <h2>👤 PERSONAGENS</h2>

            </div>

            <div id="characterGrid" class="character-grid">

                <!-- Os personagens serão colocados pelo JavaScript -->

            </div>

        </section>


        <!-- =========================
             TELA DO JOGO
        ========================== -->

        <section id="gameScreen" class="screen">

            <!-- PLACAR -->

            <div class="hud">

                <div class="team-score">

                    <span>AZUL</span>

                    <strong id="playerScore">
                        0
                    </strong>

                </div>


                <div class="round">

                    ROUND

                    <span id="roundNumber">
                        1
                    </span>

                </div>


                <div class="team-score enemy">

                    <span>VERMELHO</span>

                    <strong id="enemyScore">
                        0
                    </strong>

                </div>

            </div>


            <!-- QUADRA -->
            <div id="gameArea"></div>
            <div id="court">

                <div class="midline"></div>

                <div class="team-label left">
                    SEU TIME
                </div>

                <div class="team-label right">
                    RIVAL
                </div>


                <!-- OS JOGADORES SERÃO CRIADOS PELO JAVASCRIPT -->

                <div id="players"></div>


                <!-- BOLA -->

                <div id="ball" class="ball">
                    🏐
                </div>


                <!-- MENSAGEM -->

                <div id="message" class="power-text"></div>

            </div>


            <!-- CONTROLES -->

            <div class="mobile-controls">

                <div class="joystick-area">

                    <button id="upBtn">
                        ▲
                    </button>

                    <button id="leftBtn">
                        ◀
                    </button>

                    <button id="rightBtn">
                        ▶
                    </button>

                    <button id="downBtn">
                        ▼
                    </button>

                </div>


                <div class="action-buttons">

                    <button id="defendBtn" class="action defend">
                        🛡️
                    </button>

                    <button id="powerBtn" class="action power">
                        ⚡
                    </button>

                    <button id="throwBtn" class="action throw">
                        🏐
                    </button>

                </div>

            </div>


            <p class="desktop-hint">
                Teclas: WASD/Setas = mover • Espaço = arremessar •
                Shift = defender • E = poder
            </p>

        </section>


        <!-- =========================
             TELA FINAL
        ========================== -->

        <section id="resultScreen" class="screen">

            <div class="result-card">

                <h1 id="resultTitle">
                    FIM DE JOGO
                </h1>

                <p id="resultMessage"></p>

                <button id="restartBtn" class="main-btn">
                    🔄 JOGAR NOVAMENTE
                </button>

                <button id="menuBtn" class="main-btn">
                    ← MENU
                </button>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/game.js"></script>

</body>
</html>
